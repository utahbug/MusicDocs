<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#334f60">
    <meta name="description" content="Test your Utah history knowledge in ten quick questions.">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <title>Utah History Sprint | UtahBug</title>
    <link rel="stylesheet" href="../utahbug-playground-20260714c.css?v=20260725r">
    <link rel="stylesheet" href="../history.css?v=20260725a">
  </head>
  <body class="history-hub-page">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="../index.html" aria-label="Return to the UtahBug home page">
          <span><strong>UtahBug</strong></span>
        </a>
      </div>
    </header>

    <main class="history-main">
      <header class="history-heading">
        <div>
          <h1>UTAH HISTORY</h1>
          <p>Ten questions across Utah’s long history.</p>
        </div>
        <nav class="history-mode-links" aria-label="Utah history activities">
          <a href="history.html">Explore</a>
          <a href="history-order.html">Order</a>
          <a aria-current="page" href="history-sprint.html">Sprint</a>
        </nav>
      </header>

      <section class="history-game-shell sprint-game">
        <div class="history-game-status">
          <p id="sprint-progress">Question 1 of 10 &middot; Score 0</p>
          <button class="history-game-button" id="restart-history-sprint" type="button">Restart</button>
        </div>

        <div class="history-question-panel" id="history-question-panel">
          <p class="history-question-number" id="history-question-number">Question 1</p>
          <h2 id="history-question"></h2>
          <div class="history-choices" id="history-choices"></div>
        </div>

        <div class="history-sprint-result">
          <p class="history-game-feedback" id="history-sprint-feedback" aria-live="polite"></p>
          <p class="history-explanation" id="history-explanation" hidden></p>
          <button class="history-game-button history-next" id="history-next" type="button" hidden>Next</button>
        </div>
      </section>
    </main>

    <footer class="history-site-footer">
      <span>&copy; 2026 UtahBug</span>
      <a href="history.html">Explore the Utah history timeline</a>
    </footer>

    <script src="../history-data.js?v=20260725a"></script>
    <script>
      (function () {
        "use strict";

        const progress = document.querySelector("#sprint-progress");
        const questionNumber = document.querySelector("#history-question-number");
        const questionText = document.querySelector("#history-question");
        const choices = document.querySelector("#history-choices");
        const feedback = document.querySelector("#history-sprint-feedback");
        const explanation = document.querySelector("#history-explanation");
        const nextButton = document.querySelector("#history-next");
        const restartButton = document.querySelector("#restart-history-sprint");
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let missedCurrent = false;

        function shuffle(items) {
          const copy = [...items];
          for (let index = copy.length - 1; index > 0; index -= 1) {
            const randomIndex = Math.floor(Math.random() * (index + 1));
            [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
          }
          return copy;
        }

        function startGame() {
          questions = shuffle(window.UTAH_HISTORY_QUESTIONS);
          currentIndex = 0;
          score = 0;
          renderQuestion();
        }

        function renderQuestion() {
          const question = questions[currentIndex];
          missedCurrent = false;
          progress.textContent = `Question ${currentIndex + 1} of ${questions.length} · Score ${score}`;
          questionNumber.textContent = `Question ${currentIndex + 1}`;
          questionText.textContent = question.prompt;
          choices.replaceChildren();
          feedback.textContent = "";
          feedback.className = "history-game-feedback";
          explanation.hidden = true;
          explanation.textContent = "";
          nextButton.hidden = true;

          shuffle(question.choices).forEach((choice) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = choice;
            button.addEventListener("click", () => answerQuestion(button, choice));
            choices.append(button);
          });
        }

        function answerQuestion(button, choice) {
          const question = questions[currentIndex];

          if (choice !== question.answer) {
            missedCurrent = true;
            button.disabled = true;
            button.classList.add("is-wrong");
            feedback.textContent = "Not quite — try again.";
            feedback.className = "history-game-feedback is-wrong";
            return;
          }

          if (!missedCurrent) score += 1;
          button.classList.add("is-correct");
          choices.querySelectorAll("button").forEach((choiceButton) => {
            choiceButton.disabled = true;
          });
          feedback.textContent = "Correct.";
          feedback.className = "history-game-feedback is-correct";
          explanation.textContent = question.explanation;
          explanation.hidden = false;
          nextButton.textContent =
            currentIndex === questions.length - 1 ? "See score" : "Next";
          nextButton.hidden = false;
          progress.textContent = `Question ${currentIndex + 1} of ${questions.length} · Score ${score}`;
        }

        function advance() {
          if (currentIndex < questions.length - 1) {
            currentIndex += 1;
            renderQuestion();
            return;
          }

          questionNumber.textContent = "Complete";
          questionText.textContent = `You scored ${score} of ${questions.length}.`;
          choices.replaceChildren();
          feedback.textContent =
            score === questions.length
              ? "Perfect history sprint!"
              : "Good work. Try another round to improve your score.";
          feedback.className = "history-game-feedback is-correct";
          explanation.hidden = true;
          nextButton.hidden = true;
          progress.textContent = `Finished · Score ${score} of ${questions.length}`;
        }

        nextButton.addEventListener("click", advance);
        restartButton.addEventListener("click", startGame);
        startGame();
      })();
    </script>
  </body>
</html>
