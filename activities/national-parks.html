    <main class="page-main">
      <section class="activity-hero">
        <p class="kicker">NPS Utah</p>
        <h1>National Parks & NPS Sites</h1>
        <p>The Mighty Five plus other Utah National Park Service units. Later we can split “National Parks” from “all NPS Utah sites.”</p>
        <div class="source-links">
          <a href="https://www.nps.gov/state/ut/index.htm" target="_blank" rel="noopener">NPS Utah page</a>
        </div>
      </section>
      <div class="reveal-grid ">
        <button class="reveal-card" type="button" data-answer="Arches National Park" data-note="">
          <span class="prompt">Over 2,000 natural stone arches</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Bryce Canyon National Park" data-note="">
          <span class="prompt">Largest concentration of hoodoos</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Canyonlands National Park" data-note="">
          <span class="prompt">Island in the Sky, Needles, Maze</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Capitol Reef National Park" data-note="">
          <span class="prompt">Waterpocket Fold</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Zion National Park" data-note="">
          <span class="prompt">Massive sandstone cliffs and canyon hikes</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Cedar Breaks National Monument" data-note="">
          <span class="prompt">High amphitheater above Cedar City</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Dinosaur National Monument" data-note="">
          <span class="prompt">Fossil quarry near Vernal</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Glen Canyon National Recreation Area" data-note="">
          <span class="prompt">Lake Powell recreation area</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Golden Spike National Historical Park" data-note="">
          <span class="prompt">Last Spike site</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Natural Bridges National Monument" data-note="">
          <span class="prompt">Three natural bridges</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Rainbow Bridge National Monument" data-note="">
          <span class="prompt">Sacred span near Lake Powell</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
        <button class="reveal-card" type="button" data-answer="Timpanogos Cave National Monument" data-note="">
          <span class="prompt">Cave tours above American Fork</span>
          <span class="answer" aria-live="polite">Tap to reveal</span>
        </button>
