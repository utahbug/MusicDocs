<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#345d70">
  <meta name="description" content="Explore Utah's national parks, national monuments, and state parks.">
  <title>Explore Utah Parks | UtahBug</title>
  <link rel="icon" href="../assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../parks.css?v=20260725a">
</head>
<body>
  <header class="parks-header">
    <div class="parks-header-inner">
      <a class="parks-home" href="../index.html" aria-label="Return to the UtahBug home page">
        <strong>UtahBug</strong>
      </a>
    </div>
  </header>

  <main class="parks-main">
    <header class="parks-heading">
      <div>
        <h1>UTAH PARKS</h1>
        <p>National parks, national monuments, and Utah State Parks.</p>
      </div>
      <nav class="parks-mode-links" aria-label="Utah parks activities">
        <a aria-current="page" href="national-parks.html">Explore</a>
        <a href="parks-match.html">Match</a>
        <a href="parks-sprint.html">Sprint</a>
      </nav>
    </header>

    <section class="park-category-tiles" id="park-category-tiles" aria-label="Choose a park group"></section>

    <section class="park-explore-panel" aria-labelledby="park-section-title">
      <header class="park-section-heading">
        <div>
          <h2 id="park-section-title"></h2>
          <p id="park-section-description"></p>
        </div>
        <a class="park-source-link" id="park-source-link" target="_blank" rel="noopener"></a>
      </header>
      <div class="park-place-grid" id="park-place-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="parks-footer">
    <span>&copy; 2026 UtahBug</span>
    <span>
      <a href="https://www.nps.gov/state/ut/index.htm" target="_blank" rel="noopener">National Park Service</a>
      &nbsp;&middot;&nbsp;
      <a href="https://stateparks.utah.gov/parks/" target="_blank" rel="noopener">Utah State Parks</a>
    </span>
  </footer>

  <script src="../parks-data.js?v=20260725a"></script>
  <script>
    (function () {
      "use strict";

      const tiles = document.querySelector("#park-category-tiles");
      const title = document.querySelector("#park-section-title");
      const description = document.querySelector("#park-section-description");
      const source = document.querySelector("#park-source-link");
      const grid = document.querySelector("#park-place-grid");
      let activeGroup = "national-parks";

      function renderTiles() {
        const fragment = document.createDocumentFragment();

        window.UTAH_PARK_GROUPS.forEach((group) => {
          const button = document.createElement("button");
          const image = document.createElement("img");
          const copy = document.createElement("span");
          const label = document.createElement("strong");
          const count = document.createElement("small");

          button.className = "park-category-tile";
          button.type = "button";
          button.dataset.group = group.id;
          button.setAttribute("aria-pressed", String(group.id === activeGroup));
          image.src = `../assets/parks/${group.image}`;
          image.alt = group.imageAlt;
          label.textContent = group.shortLabel;
          count.textContent = group.countLabel;
          copy.append(label, count);
          button.append(image, copy);
          button.addEventListener("click", () => selectGroup(group.id, true));
          fragment.append(button);
        });

        tiles.replaceChildren(fragment);
      }

      function renderPlaces(group) {
        const places = window.UTAH_PARKS.filter((place) => place.group === group.id);
        const fragment = document.createDocumentFragment();

        places.forEach((place) => {
          const card = document.createElement("article");
          const heading = document.createElement("h3");
          const region = document.createElement("span");
          const clue = document.createElement("p");

          card.className = "park-place-card";
          heading.textContent = place.name;
          region.className = "park-place-region";
          region.textContent = place.region;
          clue.textContent = place.clue;
          card.append(heading, region, clue);
          fragment.append(card);
        });

        grid.replaceChildren(fragment);
      }

      function selectGroup(groupId, updateHash) {
        const group =
          window.UTAH_PARK_GROUPS.find((item) => item.id === groupId) ||
          window.UTAH_PARK_GROUPS[0];

        activeGroup = group.id;
        title.textContent = group.title;
        description.textContent = group.description;
        source.href = group.sourceUrl;
        source.textContent = `${group.sourceLabel} ↗`;
        tiles.querySelectorAll("[data-group]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.group === group.id));
        });
        renderPlaces(group);

        if (updateHash) {
          history.replaceState(null, "", `#${group.id}`);
        }
      }

      const requestedGroup = window.location.hash.slice(1);
      if (window.UTAH_PARK_GROUPS.some((group) => group.id === requestedGroup)) {
        activeGroup = requestedGroup;
      }

      renderTiles();
      selectGroup(activeGroup, false);
    })();
  </script>
</body>
</html>
