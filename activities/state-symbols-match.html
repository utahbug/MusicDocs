<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23322c">
  <meta name="description" content="Match Utah's official state symbols with their designations.">
  <title>Utah Symbols Match | UtahBug</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/state-symbols/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/state-symbols/utah-symbols-icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/state-symbols/apple-touch-icon.png">
  <link rel="stylesheet" href="../symbols.css?v=20260725d">
</head>
<body class="match-page">
  <header class="app-header">
    <div class="header-inner">
      <a class="parent-home" href="../index.html" aria-label="Return to the UtahBug home page">
        <strong>UtahBug</strong>
      </a>
    </div>
  </header>

  <main class="symbol-main">
    <header class="symbol-heading">
      <div>
        <h1>UTAH SYMBOLS</h1>
        <p>Find the six matching symbol pairs.</p>
      </div>
      <nav class="symbol-mode-links" aria-label="Utah symbol activities">
        <a href="state-symbols.html">Explore</a>
        <a aria-current="page" href="state-symbols-match.html">Match</a>
        <a href="state-symbols-sprint.html">Sprint</a>
      </nav>
    </header>

    <section class="game-shell" aria-labelledby="match-status">
      <div class="game-status">
        <p id="match-status">0 of 6 matches &middot; 0 attempts</p>
        <div class="game-categories" role="group" aria-label="Choose symbol category">
          <button type="button" data-category="all" aria-pressed="true">All</button>
          <button type="button" data-category="nature" aria-pressed="false">Nature</button>
          <button type="button" data-category="culture" aria-pressed="false">Culture</button>
          <button type="button" data-category="heritage" aria-pressed="false">Heritage</button>
        </div>
        <button class="game-button" id="new-match-round" type="button">New round</button>
      </div>
      <div class="match-board" id="match-board" aria-label="Symbol matching board"></div>
      <p class="game-message" id="match-message" aria-live="polite"></p>
    </section>
  </main>

  <footer class="symbol-footer">
    <span>&copy; 2026 UtahBug</span>
    <span><a href="state-symbols.html">Explore all Utah symbols</a></span>
  </footer>

  <script src="../symbols-data.js?v=20260725d"></script>
  <script>
    (function () {
      "use strict";

      const board = document.querySelector("#match-board");
      const status = document.querySelector("#match-status");
      const message = document.querySelector("#match-message");
      const newRoundButton = document.querySelector("#new-match-round");
      const categoryButtons = document.querySelectorAll(
        ".game-categories [data-category]",
      );
      let firstTile = null;
      let secondTile = null;
      let locked = false;
      let matches = 0;
      let attempts = 0;
      let mismatchTimer = null;
      let activeCategory = "all";
      let remainingSymbols = [];
      let roundPairCount = 6;

      function shuffle(items) {
        const result = [...items];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
        }
        return result;
      }

      function imagePath(symbol) {
        return `../assets/state-symbols/card-images/${symbol.image}`;
      }

      function categoryPool() {
        if (activeCategory === "all") {
          return [...window.UTAH_SYMBOLS];
        }
        return window.UTAH_SYMBOLS.filter(
          (symbol) => symbol.group === activeCategory,
        );
      }

      function resetDeck() {
        remainingSymbols = shuffle(categoryPool());
      }

      function drawSymbols(count) {
        const pool = categoryPool();
        const targetCount = Math.min(count, pool.length);
        const selected = [];
        const selectedIds = new Set();

        while (selected.length < targetCount) {
          if (remainingSymbols.length === 0) {
            resetDeck();
          }
          const symbol = remainingSymbols.shift();
          if (selectedIds.has(symbol.id)) {
            remainingSymbols.push(symbol);
            continue;
          }
          selected.push(symbol);
          selectedIds.add(symbol.id);
        }
        return selected;
      }

      function updateStatus() {
        status.textContent =
          `${matches} of ${roundPairCount} matches · ${attempts} ${attempts === 1 ? "attempt" : "attempts"}`;
      }

      function showCover(button) {
        const cover = document.createElement("span");
        cover.className = "match-cover";
        cover.textContent = "?";
        button.replaceChildren(cover);
        button.classList.remove("is-open");
        button.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-label", "Hidden matching tile");
      }

      function showTile(button) {
        const tile = button.tileData;
        button.classList.add("is-open");
        button.setAttribute("aria-pressed", "true");

        if (tile.kind === "label") {
          const label = document.createElement("span");
          label.className = "match-label";
          label.textContent = tile.symbol.label;
          button.replaceChildren(label);
          button.setAttribute("aria-label", tile.symbol.label);
        } else {
          const wrapper = document.createElement("span");
          const name = document.createElement("span");
          wrapper.className = "match-symbol";
          name.textContent = tile.symbol.name;
          if (tile.symbol.visual === false) {
            wrapper.classList.add("match-text-symbol");
            if (tile.symbol.musical) {
              wrapper.classList.add("musical-symbol");
            }
            wrapper.append(name);
          } else {
            const image = document.createElement("img");
            image.src = imagePath(tile.symbol);
            image.alt = "";
            wrapper.append(image, name);
          }
          button.replaceChildren(wrapper);
          button.setAttribute("aria-label", tile.symbol.name);
        }
      }

      function closeUnmatched() {
        showCover(firstTile);
        showCover(secondTile);
        firstTile = null;
        secondTile = null;
        locked = false;
        mismatchTimer = null;
      }

      function selectTile(button) {
        if (
          locked ||
          button === firstTile ||
          button.classList.contains("is-matched")
        ) {
          return;
        }

        showTile(button);

        if (!firstTile) {
          firstTile = button;
          return;
        }

        secondTile = button;
        locked = true;
        attempts += 1;

        if (firstTile.tileData.symbol.id === secondTile.tileData.symbol.id) {
          firstTile.classList.add("is-matched");
          secondTile.classList.add("is-matched");
          firstTile.disabled = true;
          secondTile.disabled = true;
          matches += 1;
          firstTile = null;
          secondTile = null;
          locked = false;
          message.textContent =
            matches === roundPairCount ? "All pairs matched!" : "Match!";
          updateStatus();
          return;
        }

        message.textContent = "Try another pair.";
        updateStatus();
        mismatchTimer = window.setTimeout(closeUnmatched, 1800);
      }

      function startRound() {
        if (mismatchTimer) {
          window.clearTimeout(mismatchTimer);
          mismatchTimer = null;
        }
        const symbols = drawSymbols(6);
        roundPairCount = symbols.length;
        const tiles = shuffle(
          symbols.flatMap((symbol) => [
            { symbol, kind: "label" },
            { symbol, kind: "image" },
          ]),
        );
        const fragment = document.createDocumentFragment();

        firstTile = null;
        secondTile = null;
        locked = false;
        matches = 0;
        attempts = 0;
        message.textContent = "Tap two tiles to find a pair.";
        updateStatus();

        tiles.forEach((tile) => {
          const button = document.createElement("button");
          button.className = "match-tile";
          button.type = "button";
          button.tileData = tile;
          showCover(button);
          button.addEventListener("click", () => selectTile(button));
          fragment.append(button);
        });

        board.replaceChildren(fragment);
      }

      categoryButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          categoryButtons.forEach((categoryButton) => {
            categoryButton.setAttribute(
              "aria-pressed",
              String(categoryButton === button),
            );
          });
          resetDeck();
          startRound();
        });
      });

      newRoundButton.addEventListener("click", startRound);
      resetDeck();
      startRound();
    })();
  </script>
</body>
</html>
