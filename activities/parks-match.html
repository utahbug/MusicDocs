<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#345d70">
  <meta name="description" content="Match Utah parks and monuments with their signature features.">
  <title>Utah Parks Match | UtahBug</title>
  <link rel="icon" href="../assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../parks.css?v=20260725a">
</head>
<body>
  <header class="parks-header">
    <div class="parks-header-inner">
      <a class="parks-home" href="../index.html" aria-label="Return to the UtahBug home page">
        <strong>UtahBug</strong>
      </a>
    </div>
  </header>

  <main class="parks-main">
    <header class="parks-heading">
      <div>
        <h1>UTAH PARKS</h1>
        <p>Match each place with its signature feature.</p>
      </div>
      <nav class="parks-mode-links" aria-label="Utah parks activities">
        <a href="national-parks.html">Explore</a>
        <a aria-current="page" href="parks-match.html">Match</a>
        <a href="parks-sprint.html">Sprint</a>
      </nav>
    </header>

    <section class="parks-game-shell" aria-labelledby="parks-match-status">
      <div class="parks-game-status">
        <p id="parks-match-status">0 matches</p>
        <div class="parks-game-categories" role="group" aria-label="Choose park group">
          <button type="button" data-category="national-parks" aria-pressed="true">National Parks</button>
          <button type="button" data-category="national-monuments" aria-pressed="false">Monuments</button>
          <button type="button" data-category="state-parks" aria-pressed="false">State Parks</button>
        </div>
        <button class="parks-game-button" id="parks-new-match" type="button">New round</button>
      </div>

      <div class="parks-match-board" id="parks-match-board" aria-label="Park matching board"></div>
      <p class="parks-game-message" id="parks-match-message" aria-live="polite"></p>
    </section>
  </main>

  <footer class="parks-footer">
    <span>&copy; 2026 UtahBug</span>
    <span><a href="national-parks.html">Explore Utah parks</a></span>
  </footer>

  <script src="../parks-data.js?v=20260725a"></script>
  <script>
    (function () {
      "use strict";

      const board = document.querySelector("#parks-match-board");
      const status = document.querySelector("#parks-match-status");
      const message = document.querySelector("#parks-match-message");
      const newRound = document.querySelector("#parks-new-match");
      const categoryButtons = document.querySelectorAll("[data-category]");
      let activeCategory = "national-parks";
      let remaining = [];
      let firstCard = null;
      let secondCard = null;
      let locked = false;
      let matches = 0;
      let attempts = 0;
      let pairCount = 5;
      let mismatchTimer = null;

      function shuffle(items) {
        const result = [...items];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
        }
        return result;
      }

      function pool() {
        return window.UTAH_PARKS.filter((place) => place.group === activeCategory);
      }

      function resetDeck() {
        remaining = shuffle(pool());
      }

      function drawPlaces() {
        const source = pool();
        const targetCount = Math.min(activeCategory === "national-parks" ? 5 : 6, source.length);
        const selected = [];
        const selectedIds = new Set();

        while (selected.length < targetCount) {
          if (remaining.length === 0) resetDeck();
          const place = remaining.shift();
          if (selectedIds.has(place.id)) {
            remaining.push(place);
            continue;
          }
          selected.push(place);
          selectedIds.add(place.id);
        }
        return selected;
      }

      function updateStatus() {
        status.textContent =
          `${matches} of ${pairCount} matches · ${attempts} ${attempts === 1 ? "attempt" : "attempts"}`;
      }

      function showCover(card) {
        const cover = document.createElement("span");
        cover.className = "parks-match-cover";
        cover.textContent = "?";
        card.classList.remove("is-open");
        card.replaceChildren(cover);
        card.setAttribute("aria-label", "Hidden matching card");
      }

      function showCard(card) {
        const copy = document.createElement("span");
        copy.className = "parks-match-copy";
        copy.textContent = card.cardData.kind === "name"
          ? card.cardData.place.name
          : card.cardData.place.clue;
        card.classList.add("is-open");
        card.replaceChildren(copy);
        card.setAttribute("aria-label", copy.textContent);
      }

      function closeMismatch() {
        showCover(firstCard);
        showCover(secondCard);
        firstCard = null;
        secondCard = null;
        locked = false;
        mismatchTimer = null;
      }

      function chooseCard(card) {
        if (locked || card === firstCard || card.classList.contains("is-matched")) return;

        showCard(card);
        if (!firstCard) {
          firstCard = card;
          return;
        }

        secondCard = card;
        locked = true;
        attempts += 1;

        if (
          firstCard.cardData.place.id === secondCard.cardData.place.id &&
          firstCard.cardData.kind !== secondCard.cardData.kind
        ) {
          firstCard.classList.add("is-matched");
          secondCard.classList.add("is-matched");
          firstCard.disabled = true;
          secondCard.disabled = true;
          matches += 1;
          firstCard = null;
          secondCard = null;
          locked = false;
          message.textContent = matches === pairCount ? "All pairs matched!" : "Match!";
          updateStatus();
          return;
        }

        message.textContent = "Try another pair.";
        updateStatus();
        mismatchTimer = window.setTimeout(closeMismatch, 2200);
      }

      function startRound() {
        if (mismatchTimer) window.clearTimeout(mismatchTimer);
        mismatchTimer = null;
        const places = drawPlaces();
        pairCount = places.length;
        const cards = shuffle(
          places.flatMap((place) => [
            { place, kind: "name" },
            { place, kind: "clue" },
          ]),
        );
        const fragment = document.createDocumentFragment();

        firstCard = null;
        secondCard = null;
        locked = false;
        matches = 0;
        attempts = 0;
        message.textContent = "Tap two cards to find a place and its clue.";
        updateStatus();

        cards.forEach((cardData) => {
          const card = document.createElement("button");
          card.className = "parks-match-card";
          card.type = "button";
          card.cardData = cardData;
          card.dataset.placeId = cardData.place.id;
          card.dataset.kind = cardData.kind;
          showCover(card);
          card.addEventListener("click", () => chooseCard(card));
          fragment.append(card);
        });

        board.replaceChildren(fragment);
      }

      categoryButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          categoryButtons.forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
          resetDeck();
          startRound();
        });
      });

      newRound.addEventListener("click", startRound);
      resetDeck();
      startRound();
    })();
  </script>
</body>
</html>
