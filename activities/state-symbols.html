<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23322c">
  <meta name="description" content="Explore Utah's 40 official state symbols and designations.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="UtahBug">
  <meta property="og:title" content="Explore Utah Symbols">
  <meta property="og:description" content="Explore Utah's official state symbols and designations.">
  <meta property="og:url" content="https://utahbug.github.io/Utah/activities/state-symbols.html">
  <meta property="og:image" content="https://utahbug.github.io/Utah/assets/state-symbols/utah-symbols-social-card.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Explore Utah Symbols">
  <meta name="twitter:description" content="Explore Utah's official state symbols and designations.">
  <meta name="twitter:image" content="https://utahbug.github.io/Utah/assets/state-symbols/utah-symbols-social-card.jpg">
  <title>Explore Utah Symbols | UtahBug</title>
  <link rel="canonical" href="https://utahbug.github.io/Utah/activities/state-symbols.html">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/state-symbols/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/state-symbols/utah-symbols-icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/state-symbols/apple-touch-icon.png">
  <link rel="stylesheet" href="../symbols.css?v=20260725d">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="parent-home" href="../index.html" aria-label="Return to the UtahBug home page">
        <strong>UtahBug</strong>
      </a>
    </div>
  </header>

  <main class="symbol-main">
    <header class="symbol-heading">
      <div>
        <h1>UTAH SYMBOLS</h1>
        <p>Utah&rsquo;s official symbols and designations.</p>
      </div>
      <nav class="symbol-mode-links" aria-label="Utah symbol activities">
        <a aria-current="page" href="state-symbols.html">Explore</a>
        <a href="state-symbols-match.html">Match</a>
        <a href="state-symbols-sprint.html">Sprint</a>
      </nav>
    </header>

    <div class="symbol-sort-row">
      <p>Browse all 40 symbols.</p>
      <div class="symbol-sort" role="group" aria-label="Sort symbols">
        <button type="button" data-sort="category" aria-pressed="true">Category</button>
        <button type="button" data-sort="alphabetical" aria-pressed="false">A&ndash;Z</button>
        <button type="button" data-sort="date" aria-pressed="false">Date</button>
      </div>
    </div>

    <section class="symbol-grid" id="symbol-grid" aria-live="polite"></section>
  </main>

  <footer class="symbol-footer">
    <span>&copy; 2026 UtahBug</span>
    <span>
      <a href="https://le.utah.gov/xcode/Title63G/Chapter1/63G-1-S601.html" target="_blank" rel="noopener">Utah Code &sect;63G-1-601</a>
      &nbsp;&middot;&nbsp;
      <a href="https://onlinelibrary.utah.gov/state-symbol/" target="_blank" rel="noopener">Utah&rsquo;s Official Symbols &amp; Emblems</a>
    </span>
  </footer>

  <script src="../symbols-data.js?v=20260725d"></script>
  <script>
    (function () {
      "use strict";

      const grid = document.querySelector("#symbol-grid");
      const sortButtons = document.querySelectorAll("[data-sort]");
      const officialOrder = new Map(
        window.UTAH_SYMBOLS.map((symbol, index) => [symbol.id, index]),
      );

      function imagePath(symbol) {
        return `../assets/state-symbols/card-images/${symbol.image}`;
      }

      function render(symbols) {
        const fragment = document.createDocumentFragment();

        symbols.forEach((symbol) => {
          const originalIndex = officialOrder.get(symbol.id);
          const card = document.createElement("article");
          const label = document.createElement("h2");
          const media = document.createElement("div");
          const image = document.createElement("img");
          const copy = document.createElement("div");
          const name = document.createElement("strong");
          const year = document.createElement("span");

          card.className = `symbol-card tone-${originalIndex % 5}`;
          label.className = "symbol-card-label";
          media.className = "symbol-card-media";
          copy.className = "symbol-card-copy";

          label.textContent = symbol.label;
          if (symbol.visual === false) {
            const titleCard = document.createElement("div");
            titleCard.className = "symbol-text-symbol";
            if (symbol.musical) {
              titleCard.classList.add("musical-symbol");
            }
            titleCard.textContent = symbol.name;
            media.append(titleCard);
          } else {
            image.src = imagePath(symbol);
            image.alt = `${symbol.name}, ${symbol.label}`;
            image.loading = "lazy";
            image.decoding = "async";
            media.append(image);
          }
          name.textContent = symbol.name;
          year.textContent = `Adopted ${symbol.year}`;

          copy.append(name, year);
          card.append(label, media, copy);
          fragment.append(card);
        });

        grid.replaceChildren(fragment);
      }

      function sortedSymbols(mode) {
        const symbols = [...window.UTAH_SYMBOLS];

        if (mode === "alphabetical") {
          symbols.sort((a, b) =>
            a.label.localeCompare(b.label) || a.name.localeCompare(b.name)
          );
        } else if (mode === "date") {
          symbols.sort((a, b) =>
            a.year - b.year || a.label.localeCompare(b.label)
          );
        } else {
          symbols.sort((a, b) =>
            officialOrder.get(a.id) - officialOrder.get(b.id)
          );
        }

        return symbols;
      }

      sortButtons.forEach((button) => {
        button.addEventListener("click", () => {
          sortButtons.forEach((otherButton) => {
            otherButton.setAttribute(
              "aria-pressed",
              String(otherButton === button),
            );
          });
          render(sortedSymbols(button.dataset.sort));
        });
      });

      render(sortedSymbols("category"));
    })();
  </script>
</body>
</html>
